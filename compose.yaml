services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SAMPLE_MODE: "true"
      # Optional: with these set (see README "Modes"), the sample workspace also runs your own screenshots and context through real models.
      METERLESS_BASE_URL: ${METERLESS_BASE_URL:-}
      METERLESS_API_KEY: ${METERLESS_API_KEY:-}
      METERLESS_VISION_MODEL: ${METERLESS_VISION_MODEL:-gpt-4o-mini}
      METERLESS_REASONING_MODEL: ${METERLESS_REASONING_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${RECALL_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_CHECKIN_DEMO: "false"
    ports:
      - "127.0.0.1:${RECALL_FRONTEND_PORT:-5175}:80"
    depends_on:
      backend:
        condition: service_healthy
